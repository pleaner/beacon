org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# The server the app talks to. For local dev against `wrangler dev` on the emulator:
#   ./gradlew installDebug -PguardianUrl=http://10.0.2.2:8787
guardianUrl=https://guardian.pleaner.com

# Firebase, for push. Values come from the Firebase console (Project settings, your Android app).
# Put them in ~/.gradle/gradle.properties, not here. Left empty, the app runs without push.
firebaseAppId=
firebaseApiKey=
firebaseProjectId=
firebaseSenderId=
