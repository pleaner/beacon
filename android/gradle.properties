org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# The server the app talks to. For local dev against `wrangler dev` on the emulator:
#   ./gradlew installDebug -PguardianUrl=http://10.0.2.2:8787
guardianUrl=https://guardian.pleaner.com

# The server's Google web OAuth client (public; it's in every sign-in link). Google puts it in the ID token's
# audience, and the server checks it. The Android OAuth client in the same Google Cloud project must list this
# app's package and signing key SHA-1, or Credential Manager refuses to sign in.
googleClientId=442061960082-e1369nrmmd4827ab4ngvafrtbs34j2nd.apps.googleusercontent.com

# Firebase, for push. Values come from the Firebase console (Project settings, your Android app).
# Put them in ~/.gradle/gradle.properties, not here. Left empty, the app runs without push.
firebaseAppId=
firebaseApiKey=
firebaseProjectId=
firebaseSenderId=
